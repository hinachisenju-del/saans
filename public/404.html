<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Saans Air Quality Assistant</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #F5F1EA;
        color: #1A1D20;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background-color: #ffffff;
        border: 1px solid #DFD8CD;
        border-radius: 24px;
        padding: 40px;
        max-width: 480px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }
      .badge {
        display: inline-block;
        background-color: #E6EFEF;
        color: #1B4947;
        font-weight: 700;
        font-size: 13px;
        padding: 4px 12px;
        border-radius: 20px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 32px;
        font-weight: 800;
        color: #1B4947;
        margin: 0 0 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #555A60;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        background-color: #1B4947;
        color: #ffffff;
        text-decoration: none;
        padding: 12px 28px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #133634;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">Error 404</div>
      <h1>Page Not Found</h1>
      <p>
        The air quality guide or report you requested is not available. Return to the live dashboard for today's smog forecast, ventilation windows, and purifier protocols.
      </p>
      <a href="/" class="btn">Return to Live Dashboard</a>
    </div>
  </body>
</html>
